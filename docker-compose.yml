# Optional Postgres for the history store. The platform runs on SQLite by
# default; start this and point TRANSIT_DATABASE_URL at it for Postgres:
#   docker compose up -d
#   export TRANSIT_DATABASE_URL=postgresql+psycopg://transit:transit@localhost:5432/transit
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: transit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
