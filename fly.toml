app = "transit-display-platform"
primary_region = "iad"

[build]

[env]
TRANSIT_DATABASE_URL = "sqlite:////data/transit.db"
TRANSIT_PREDICTION_STATIONS = "E01,E02,E03"

[mounts]
source = "transit_data"
destination = "/data"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
