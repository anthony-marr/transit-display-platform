[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-display-platform"
version = "0.1.0"
description = "Streaming transit data platform behind a Raspberry Pi LED display: GTFS-RT / GBFS ingest, history, REST + WebSocket feed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "gtfs-realtime-bindings>=1.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transit-server = "transit_platform.api:main"
transit-pi-client = "transit_platform.pi_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
